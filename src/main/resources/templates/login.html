<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - OficinaFlow</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="login-pagina">
<main class="login-caixa">
  <div class="login-marca">OficinaFlow</div>
  <div class="login-sub">Gerenciamento de Oficina Mecânica</div>
  <div class="msg erro" th:if="${erro}" th:text="${erro}"></div>
  <form method="post" th:action="@{/login}" class="login-form">
    <label>Usuário
      <input name="usuario" autocomplete="username" required autofocus>
    </label>
    <label>Senha
      <input name="senha" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
