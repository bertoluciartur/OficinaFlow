services:
  db:
    image: postgres:16
    container_name: oficinaflow-db
    environment:
      POSTGRES_DB: oficinaflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficinaflow"]
      interval: 3s
      retries: 20

  app:
    build: .
    container_name: oficinaflow-app
    environment:
      OFICINA_DB_URL: jdbc:postgresql://db:5432/oficinaflow
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
